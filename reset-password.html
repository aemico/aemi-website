
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AEMI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #dcecf2;
      --blue-light: #edf5f7;
      --blue-deep: #739aa8;
      --ivory: #fbf8ef;
      --ink: #26383e;
      --muted: #6e7d80;
      --line: #d6e2e4;
      --white: #fffefa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--blue-light);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    .reset-card {
      width: min(100%, 440px);
      padding: 36px;
      background: var(--ivory);
      border: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--blue-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font: 600 34px "Playfair Display", serif;
    }

    .intro, #message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .field {
      display: grid;
      gap: 8px;
      margin: 20px 0;
    }

    label {
      font-size: 12px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      font: inherit;
      outline-color: var(--blue-deep);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--blue-deep);
      background: var(--blue);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #message { margin-top: 16px; }
    #message.error { color: #a64b4b; }
    #message.success { color: #397451; }

    .back-link {
      display: block;
      margin-top: 22px;
      color: var(--blue-deep);
      font-size: 12px;
      text-align: center;
      text-decoration: none;
    }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .reset-card { padding: 26px 22px; }
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <p class="eyebrow">AEMI Admin Space</p>
    <h1>Create a new password.</h1>
    <p class="intro">
      Choose a new password for your AEMI admin account.
    </p>

    <form id="reset-form" hidden>
      <div class="field">
        <label for="new-password">New password</label>
        <input
          id="new-password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          required
        >
      </div>

      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter your password again"
          required
        >
      </div>

      <button id="submit-button" type="submit">
        Save new password
      </button>
    </form>

    <p id="message" role="status">Checking your recovery link...</p>

    <a class="back-link" href="admin.html">Return to admin login</a>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://sonoqrxbbowgmidzhiwi.supabase.co",
      "sb_publishable_DTd8ysaf9mkHpbzJXGInPA_mkgjWKwO"
    );

    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submit-button");

    let recoverySessionReady = false;

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = type;
    }

    function showForm() {
      recoverySessionReady = true;
      form.hidden = false;
      showMessage("Your recovery link is valid. You can now create a new password.");
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        showForm();
      }
    });

    const { data, error } = await supabase.auth.getSession();

    if (error) {
      showMessage("We couldn't verify your recovery link. Request a new one.", "error");
    } else if (data.session) {
      showForm();
    } else {
      showMessage(
        "No active recovery session was found. Please request a fresh password reset email.",
        "error"
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoverySessionReady) return;

      const password = document.getElementById("new-password").value;
      const confirmation = document.getElementById("confirm-password").value;

      if (password.length < 8) {
        showMessage("Your password must be at least 8 characters.", "error");
        return;
      }

      if (password !== confirmation) {
        showMessage("Your passwords do not match. Please try again.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Saving...";

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        showMessage("Password update failed: " + error.message, "error");
        submitButton.disabled = false;
        submitButton.textContent = "Save new password";
        return;
      }

      showMessage("Your password has been updated! Redirecting to admin login...", "success");

      await supabase.auth.signOut();

      setTimeout(() => {
        window.location.replace("admin.html");
      }, 1800);
    });
  </script>
</body>
</html>
