<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Track your AEMI Chili Garlic Oil order.">

  <title>AEMI | Track Order</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <a class="brand" href="index.html">AEMI</a>

    <button class="menu-toggle" aria-label="Open menu">☰</button>

    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="index.html#product">Product</a>
      <a href="index.html#about">About</a>
      <a href="index.html#order">Order</a>
      <a href="track.html">Track Order</a>
    </nav>
  </header>


  <main>

    <section class="section order-section">

      <p class="eyebrow">ORDER TRACKING</p>

      <h1>Where's your AEMI?</h1>

      <p>
        Enter your order number below to check your latest order status.
      </p>


      <form id="trackingForm">

        <label>
          Order number

          <input
            id="orderNumber"
            type="text"
            placeholder="AEMI-0001"
            autocomplete="off"
            required
          >

        </label>


        <button class="button full" type="submit">
          TRACK ORDER
        </button>

      </form>


      <div id="trackingResult" class="tracking-result"></div>

    </section>

  </main>


  <footer>

    <strong>AEMI</strong>

    <span>CHILI GARLIC OIL</span>

    <small>
      © <span id="year"></span> AEMI. All rights reserved.
    </small>

  </footer>


  <script>

    const trackingForm =
      document.getElementById("trackingForm");

    const orderNumberInput =
      document.getElementById("orderNumber");

    const trackingResult =
      document.getElementById("trackingResult");


    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbwb91_sh-CmcorUVENEHKlyK16umG9mmKztmmy2IZyA2qMxLdLaZyahQBNgfc1LoGAg/exec";


    trackingForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const orderNumber =
        orderNumberInput.value.trim().toUpperCase();


      if (!orderNumber) {
        return;
      }


      trackingResult.innerHTML = `
        <p>Checking your order...</p>
      `;


      try {

        const response = await fetch(
          WEB_APP_URL +
          "?order=" +
          encodeURIComponent(orderNumber)
        );


        const data = await response.json();


        if (!data.success) {

          trackingResult.innerHTML = `
            <div class="tracking-card">
              <h2>Order Not Found</h2>

              <p>
                We couldn't find that order number.
                Please check it and try again.
              </p>
            </div>
          `;

          return;
        }


        const fulfillment =
          data.fulfillment.toLowerCase();

        const status =
          data.status;


        let steps;


        if (fulfillment === "delivery") {

          steps = [
            "Pending",
            "Confirmed",
            "Processing",
            "Out for Delivery",
            "Delivered"
          ];

        } else {

          steps = [
            "Pending",
            "Confirmed",
            "Ready for Pickup",
            "Picked Up"
          ];

        }


        const currentIndex =
          steps.indexOf(status);


        const timeline =
          steps.map((step, index) => {

            let className = "";

            if (index < currentIndex) {
              className = "completed";
            }

            if (index === currentIndex) {
              className = "current";
            }


            return `
              <div class="tracking-step ${className}">

                <div class="tracking-dot">
                  ${index < currentIndex ? "✓" : ""}
                </div>

                <div class="tracking-label">
                  ${step}
                </div>

              </div>
            `;

          }).join("");


        trackingResult.innerHTML = `

          <div class="tracking-card">

            <p class="eyebrow">
              ORDER NUMBER
            </p>

            <h2>
              ${data.orderNumber}
            </h2>

            <p>
              ${fulfillment === "delivery"
                ? "Delivery"
                : "Pickup"}
            </p>


            <div class="tracking-timeline">

              ${timeline}

            </div>


            <p class="tracking-current">
              Current status:
              <strong>${status}</strong>
            </p>

          </div>

        `;


      } catch (error) {

        trackingResult.innerHTML = `

          <div class="tracking-card">

            <h2>Something went wrong</h2>

            <p>
              Please try again in a moment.
            </p>

          </div>

        `;

        console.error(error);

      }

    });


    document.getElementById("year").textContent =
      new Date().getFullYear();


    document
      .querySelector(".menu-toggle")
      .addEventListener("click", () => {

        document
          .getElementById("nav")
          .classList.toggle("open");

      });

  </script>

</body>
</html>
